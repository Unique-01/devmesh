name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: "go.mod"

            - name: Get version
              id: version
              run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            - name: Build
              run: |
                  mkdir -p dist
                  go build -ldflags "-X github.com/Unique-01/devmesh/internal/cli.version=${{ steps.version.outputs.version }}" \
                    -o dist/devmesh ./cmd/devmesh

            - name: Package
              run: |
                  VERSION="${{ steps.version.outputs.version }}"
                  tar -czf "dist/devmesh_${VERSION}_linux_amd64.tar.gz" -C dist devmesh
                  rm dist/devmesh

            - name: Checksum
              run: |
                  VERSION="${{ steps.version.outputs.version }}"
                  cd dist
                  sha256sum "devmesh_${VERSION}_linux_amd64.tar.gz" > checksums.txt

            - name: Create Github Release
              uses: softprops/action-gh-releases@v3
              with:
                  tag_name: ${{github.ref_name}}
                  name: Devmesh ${{github.ref_name}}
                  generate_release_notes: true
                  files: |
                      dist/devmesh_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
                      dist/checksums.txt
